table: auth_domain_credentials
# The client credential an auth domain (a tenant's IdP) uses at the token
# endpoint: a client secret, and/or a generated private key for private_key_jwt.
# One row per auth domain. The tenant's security or settings admin sets it from
# the app; nobody provisions it through infrastructure.
#
# Never plaintext: the app encrypts through its own hook (for example a KMS data
# key) before writing, and decrypts only in memory during a token exchange.
#
# Grants. No role reachable from a tenant session can read a secret or private
# key back, by any route: app_rls gets column grants that write the ciphertext
# columns but SELECT only the public and status columns. (SELECT is also what a
# WHERE clause needs, so the ciphertext can't be probed with UPDATE … WHERE
# either.) Only app_privileged, the pre-session sign-in machinery, reads the
# ciphertext, for the token exchange.
mixins: [audit]
grants:
  - to: app_rls
    privileges: [SELECT]
    columns: [auth_domain_id, secret_set_at, private_key_set_at, public_jwk, certificate, created_at, updated_at]
  - to: app_rls
    privileges: [INSERT]
    columns:
      [
        auth_domain_id,
        secret_ciphertext,
        secret_set_at,
        private_key_ciphertext,
        private_key_set_at,
        public_jwk,
        certificate,
      ]
  - to: app_rls
    privileges: [UPDATE]
    columns: [secret_ciphertext, secret_set_at, private_key_ciphertext, private_key_set_at, public_jwk, certificate]
  - to: app_privileged
    privileges: [SELECT]
columns:
  - name: auth_domain_id
    type: bigint
    primary_key: true
    references:
      table: auth_domains
      column: auth_domain_id
  # The client secret, encrypted by the app's hook. NULL when none is set.
  - name: secret_ciphertext
    type: text
  - name: secret_set_at
    type: timestamptz
  # The PKCS#8 private key for private_key_jwt, encrypted by the app's hook.
  - name: private_key_ciphertext
    type: text
  - name: private_key_set_at
    type: timestamptz
  # The public half, readable by the tenant admin to upload to their IdP: a
  # JWK (with kid, x5c and x5t#S256) and a self-signed X.509 certificate (PEM),
  # which is what Entra's certificate upload takes.
  - name: public_jwk
    type: jsonb
  - name: certificate
    type: text
checks:
  - name: auth_domain_credentials_secret_pair_check
    expression: '(secret_ciphertext IS NULL) = (secret_set_at IS NULL)'
  - name: auth_domain_credentials_key_pair_check
    expression: '(private_key_ciphertext IS NULL) = (private_key_set_at IS NULL)'
# RLS. Whoever may configure the tenant's SSO (its security or settings admin)
# may write its credentials, for live auth domains only. A soft-deleted auth
# domain's credential is also never used: the token exchange reads it joined to
# a live auth_domains row.
rls: true
policies:
  - name: auth_domain_credentials_sso_admin
    for: ALL
    to: app_rls
    permissive: true
    using: >-
      EXISTS (SELECT 1 FROM auth_domains ad
              WHERE ad.auth_domain_id = auth_domain_credentials.auth_domain_id
                AND ad.deleted_at IS NULL
                AND (auth_has_role('security', ad.tenant_id) OR auth_has_role('settings', ad.tenant_id)))
    check: >-
      EXISTS (SELECT 1 FROM auth_domains ad
              WHERE ad.auth_domain_id = auth_domain_credentials.auth_domain_id
                AND ad.deleted_at IS NULL
                AND (auth_has_role('security', ad.tenant_id) OR auth_has_role('settings', ad.tenant_id)))
