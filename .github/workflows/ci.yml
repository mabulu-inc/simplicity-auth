# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # publish.yml calls this so nothing reaches npm without passing it.
  workflow_call:

permissions:
  contents: read

# Cancel an in-progress run for the same ref when a new push lands.
# Each unique ref still gets its own queue, so PRs and main don't
# interfere with each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes an older run; never cancel a release's gate.
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  check:
    # The floor in package.json `engines`, and the current LTS.
    strategy:
      matrix:
        node: [22, 24]
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres is provisioned per run by Testcontainers (the vitest
    # globalSetup), using the runner's Docker daemon — no service container.

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          # gitleaks needs the full git history to scan every commit,
          # not just the latest tree.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install gitleaks
        # Pinned to a specific version so the gate is reproducible.
        # Bump deliberately when we want a newer rule set.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks (full git history)
        run: gitleaks git . --no-banner --redact

      # lint → format → typecheck → build → tests. Tests start PostgreSQL
      # through Testcontainers, using the runner's Docker daemon.
      - name: pnpm check
        run: pnpm check

      # Advisory: warn (don't fail) when a direct dep has a newer
      # release on npm than what's installed. Catches "typescript-eslint
      # 9 just dropped" before we discover it at upgrade time. Runs
      # last because it's the lowest-priority check — actual test or
      # build failures should surface first.
      - name: Check for outdated direct dependencies (non-blocking)
        if: matrix.node == 24
        run: |
          set +e
          OUTPUT=$(pnpm outdated --long 2>&1)
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::warning title=Outdated dependencies::One or more direct dependencies have newer releases on npm. Run 'pnpm outdated --long' locally to see the diff and 'pnpm up --latest' to upgrade."
            echo "$OUTPUT"
          else
            echo "All direct dependencies on latest."
          fi
